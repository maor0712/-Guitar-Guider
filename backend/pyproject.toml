[project]
name = "guitar-guider-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1",
    "fastapi>=0.162.0",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.33",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
guitar-guider-backend = "guitar_guider_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
